[package]
name = "exchange8-risk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Exchange8-dev/exchange8-risk"
rust-version = "1.85"
description = "Sentin8 exchange8 risk service."

[[bin]]
name = "exchange8-risk"
path = "src/main.rs"


[dependencies]
# Platform SDK pin (RS 2.3) - the only cross-repo dependency; carries the
# entire shared library workspace behind the `sentin8` facade.
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.3" }
# exchange8 namespace facade pin - carries this vertical's contracts/clients.
exchange8 = { git = "https://github.com/Exchange8-dev/exchange8-sdk", tag = "exchange8-v0.5.3" }

mimalloc = "0.1"
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "rust_decimal"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
